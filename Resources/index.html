let categories=JSON.parse(localStorage.getItem('mellow-categories')||'null')||['灵感碎片','日常记录','工作手记'];let categoryColors=JSON.parse(localStorage.getItem('mosslet-category-colors')||'{}');const palette=['#e6a04b','#739bd0','#ba87c7','#79ac94','#db8585','#929292'];const pixelPalettes=[{name:'掌机复古',hint:'低饱和 · 安静耐看',colors:['#6D8456','#B38A48','#688C9C','#A57169','#8A789D','#888674']},{name:'暖色街机',hint:'砖红与金黄 · 复古活泼',colors:['#C56849','#D3A43F','#728C67','#A97887','#8196A2','#8D796A']},{name:'冷色终端',hint:'蓝紫与青色 · 清爽克制',colors:['#5686B5','#8172AC','#52968E','#AE7598','#8995A4','#B09A63']},{name:'柔和彩糖',hint:'柔粉与浅蓝 · 轻盈可爱',colors:['#C6859A','#789DC2','#9A89BD','#82A48C','#C6A15F','#AA8C78']}];let categoryDraft=[];let notes=[],selected=null,filter='all',query='',timer;const $=id=>document.getElementById(id);const native=!!window.webkit?.messageHandlers?.mellow;const send=(action,data={})=>{if(native)window.webkit.messageHandlers.mellow.postMessage({action,...data});else if(action==='save'){localStorage.setItem('mellow-notes',JSON.stringify(data.notes));saved(true)}};const today=()=>new Date().toISOString();const current=()=>notes.find(n=>n.id===selected);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleDateString('zh-CN',{month:'long',day:'numeric'});function persist(){ $('save-status').textContent='保存中…';send('save',{notes})}window.saved=ok=>{$('save-status').textContent=ok?'已保存':'保存失败，请导出备份';};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function list(){const found=notes.filter(n=>(filter==='trash'?!!n.deleted:!n.deleted&&(filter==='all'||filter==='pinned'&&n.pinned||n.category===filter))&&(!query||(n.title+' '+n.body).toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated.localeCompare(a.updated));$('cards').innerHTML=found.length?found.map(n=>`<button class="card ${n.id===selected?'selected':''}" data-id="${n.id}"><div class="card-title"><span>${escape(n.title||'未命名笔记')}</span><span style="color:#777">${n.pinned?'✧':''}</span></div><p>${escape(n.body.slice(0,90)||'空白笔记')}</p><div class="card-bottom"><span>${date(n.updated)}</span><span class="pill" style="--tag-color:${colorFor(n.category)};--tag-tint:${colorFor(n.category)}18">${escape(n.category)}</span></div></button>`).join(''):'<div class="empty">暂无笔记</div>';$('result-count').textContent=found.length+' 篇笔记';$('all-count').textContent=notes.filter(n=>!n.deleted).length;$('trash-count').textContent=notes.filter(n=>n.deleted).length;$('pin-count').textContent=notes.filter(n=>n.pinned&&!n.deleted).length;document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{selected=el.dataset.id;remember();render()})}
function render(){list();updateCategoryPicker();let n=current();$('document').style.visibility=n?'visible':'hidden';for(const id of ['pin','export','delete','compact'])$(id).disabled=!n;$('restore').hidden=!n?.deleted;$('delete').hidden=!!n?.deleted;$('trash-banner').hidden=!n?.deleted;for(const id of ['title','body','category'])$(id).disabled=!!n?.deleted;$('compact').disabled=!n||!!n.deleted;$('pin').disabled=!n||!!n.deleted;if(!n){$('word-count').textContent='0 字';return}$('title').value=n.title;$('body').value=n.body;$('category').value=n.category;$('breadcrumb').textContent=n.category;$('date').textContent=date(n.created)+' 创建';$('pin').textContent=n.pinned?'已置顶':'置顶';$('pin').classList.toggle('on',n.pinned);$('word-count').textContent=n.body.replace(/\s/g,'').length+' 字'}
function add(body='',title=''){let n={id:crypto.randomUUID(),title,body,category:categories.includes(filter)?filter:categories[0],pinned:false,created:today(),updated:today()};notes.unshift(n);selected=n.id;remember();filter='all';query='';$('search').value='';nav();persist();render();$('title').focus()}
function nav(){document.querySelectorAll('[data-filter]').forEach(e=>e.classList.toggle('active',e.dataset.filter===filter));$('list-title').textContent=filter==='all'?'全部笔记':filter==='pinned'?'置顶收藏':filter==='trash'?'废纸篓':filter}
function remember(){localStorage.setItem('mellow-selected',selected||'')}
function bindNavigation(){document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{filter=e.dataset.filter;selected=notes.find(n=>filter==='trash'?n.deleted:!n.deleted&&(filter==='all'||filter==='pinned'&&n.pinned||n.category===filter))?.id;remember();nav();render()})}
function colorFor(name){return /^#[0-9a-f]{6}$/i.test(categoryColors[name]||'')?categoryColors[name]:palette[Math.max(0,categories.indexOf(name))%palette.length]}
function updateCategoryPicker(){const n=current();$('category-label').textContent=n?.category||'选择分类';$('category-trigger').style.setProperty('--category-color',colorFor(n?.category));$('category-trigger').disabled=!n||!!n.deleted;$('category-options').innerHTML=categories.map((name,i)=>`<button type="button" class="category-option ${n?.category===name?'selected':''}" data-category-index="${i}"><i class="category-dot" style="--category-color:${colorFor(name)}"></i>${escape(name)}<span>${n?.category===name?'✓':''}</span></button>`).join('')+'<button type="button" class="category-option" id="picker-manage" style="border-top:1px solid #ddd">＋ 管理分类</button>';document.querySelectorAll('[data-category-index]').forEach(el=>el.onclick=()=>{const note=current();if(!note||note.deleted)return;note.category=categories[Number(el.dataset.categoryIndex)];note.updated=today();persist();render();closePicker()});$('picker-manage').onclick=()=>{closePicker();$('edit-categories').onclick()}}
function closePicker(){$('category-options').hidden=true;$('category-trigger').setAttribute('aria-expanded','false')}
$('category-trigger').onclick=()=>{const open=$('category-options').hidden;updateCategoryPicker();$('category-options').hidden=!open;$('category-trigger').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('.category-picker'))closePicker()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePicker();closeCategories()}});
function categoryUI(){$('category-nav').innerHTML=categories.map(name=>`<button class="nav" data-filter="${escape(name)}"><i class="dot" style="--category-color:${colorFor(name)}"></i>${escape(name)}</button>`).join('');$('category').innerHTML=categories.map(name=>`<option>${escape(name)}</option>`).join('');bindNavigation()}
function drawPalettePresets(){$('palette-presets').innerHTML='<div class="palette-caption">预设配色 · 点击预览，保存后应用</div><div class="palette-grid">'+pixelPalettes.map((p,i)=>`<button type="button" class="palette-choice" data-palette="${i}" aria-label="${p.name}配色"><b>${p.name}</b><span class="palette-swatches">${p.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><small>${p.hint}</small></button>`).join('')+'</div>';document.querySelectorAll('[data-palette]').forEach(el=>el.onclick=()=>{const palette=pixelPalettes[Number(el.dataset.palette)];categoryDraft.forEach((row,i)=>row.color=palette.colors[i%palette.colors.length]);drawCategoryFields();document.querySelectorAll('[data-palette]').forEach(button=>button.classList.toggle('chosen',button===el))})}
function drawCategoryFields(){$('category-fields').innerHTML=categoryDraft.map((row,i)=>`<div class="category-row"><input type="color" aria-label="分类 ${i+1} 的颜色" value="${row.color}" data-color-index="${i}"><input type="text" aria-label="分类 ${i+1} 的名称" value="${escape(row.name)}" maxlength="20" required data-name-index="${i}" placeholder="分类名称"><span class="pill pixel-preview" style="--tag-color:${row.color};--tag-tint:${row.color}18">${escape(row.name||'分类')}</span></div>`).join('');document.querySelectorAll('[data-name-index]').forEach(el=>el.oninput=()=>{const row=categoryDraft[Number(el.dataset.nameIndex)];row.name=el.value;el.parentElement.querySelector('.pixel-preview').textContent=el.value||'分类'});document.querySelectorAll('[data-color-index]').forEach(el=>el.oninput=()=>{const row=categoryDraft[Number(el.dataset.colorIndex)];row.color=el.value;const preview=el.parentElement.querySelector('.pixel-preview');preview.style.setProperty('--tag-color',el.value);preview.style.setProperty('--tag-tint',el.value+'18')})}
$('edit-categories').onclick=()=>{categoryDraft=categories.map(name=>({old:name,name,color:colorFor(name)}));drawPalettePresets();drawCategoryFields();$('category-error').textContent='';$('category-dialog').hidden=false;$('category-dialog').style.display='flex'};
$('category-add').onclick=()=>{categoryDraft.push({old:null,name:'',color:palette[categoryDraft.length%palette.length]});drawCategoryFields();const fields=document.querySelectorAll('[data-name-index]');fields[fields.length-1]?.focus()};
function closeCategories(){$('category-dialog').hidden=true;$('category-dialog').style.display='none'}$('category-cancel').onclick=closeCategories;
function saveCategoryDraft(){const names=categoryDraft.map(row=>row.name.trim());if(names.some(n=>!n)||new Set(names).size!==names.length||names.some(n=>['all','pinned','trash'].includes(n))){$('category-error').textContent='名称不能为空、重复或使用 all / pinned / trash。';return false}const map=new Map(categoryDraft.filter(row=>row.old!==null).map(row=>[row.old,row.name.trim()]));for(const n of notes)n.category=map.get(n.category)||n.category;filter=map.get(filter)||filter;categories=names;categoryColors=Object.fromEntries(categoryDraft.map(row=>[row.name.trim(),row.color]));localStorage.setItem('mellow-categories',JSON.stringify(categories));localStorage.setItem('mosslet-category-colors',JSON.stringify(categoryColors));if(native)send('categories',{categories,colors:categoryColors});categoryUI();persist();nav();render();closeCategories();toast('分类已保存');return true}
$('category-form').onsubmit=e=>{e.preventDefault();saveCategoryDraft()};
window.openNote=id=>{const n=notes.find(n=>n.id===id&&!n.deleted);if(!n)return;selected=id;remember();filter='all';query='';$('search').value='';nav();render();$('body').focus();$('body').setSelectionRange(n.body.length,n.body.length)};
window.appendFromComposer=(value,id)=>{if(!id){window.captureQuick(value);return}const n=notes.find(n=>n.id===id&&!n.deleted);if(!n)throw new Error('笔记不存在或已删除，草稿已保留');n.body=n.body+(n.body&&!n.body.endsWith('\n')?'\n':'')+value;n.updated=today();selected=id;remember();persist();render();toast('新增内容已追加到文档')};
window.captureQuick=(value,id)=>{if(id){const n=notes.find(n=>n.id===id&&!n.deleted);if(!n)throw new Error('笔记不存在或已删除，草稿已保留');n.body=value;n.updated=today();selected=id;remember();persist();render()}else add(value,value.split('\n')[0].slice(0,24));toast('已保存')};;window.boot=(data,savedCategories,savedColors)=>{if(savedColors&&typeof savedColors==='object')categoryColors=savedColors;if(Array.isArray(savedCategories)&&savedCategories.length)categories=savedCategories;notes=Array.isArray(data)?data:[{id:crypto.randomUUID(),title:'使用快捷键',body:'回车换行，⌘回车提交。\n⌃⌥空格：速记\n⌃⌥D：文档续写\n⌃⌥H：隐藏窗口\n\n内容保存在本机。',category:'灵感碎片',pinned:true,created:today(),updated:today()}];let migrated=false;categories=[...new Set([...categories,...notes.map(n=>n.category)])];categoryUI();selected=notes.find(n=>n.id===localStorage.getItem('mellow-selected')&&!n.deleted)?.id||notes.find(n=>!n.deleted)?.id;render();if(data===null||migrated)persist()};$('new').onclick=()=>add();bindNavigation();$('search').oninput=e=>{query=e.target.value;list()};for(const id of ['title','body','category'])$(id).addEventListener(id==='category'?'change':'input',()=>{let n=current();if(!n)return;n[id==='category'?'category':id]=$(id).value;n.updated=today();persist();list();$('breadcrumb').textContent=n.category;$('word-count').textContent=n.body.replace(/\s/g,'').length+' 字'});$('pin').onclick=()=>{let n=current();if(n){n.pinned=!n.pinned;persist();render()}};$('compact').onclick=()=>{const n=current();if(!n||n.deleted)return;if(native)send('editNote',{id:n.id,title:n.title,body:n.body});else toast('桌面版支持文档续写')};$('delete').onclick=()=>{let n=current();if(!n)return;n.deleted=today();selected=notes.find(x=>!x.deleted)?.id;remember();persist();render();toast('已移到废纸篓，可在左侧恢复')};$('restore').onclick=()=>{const n=current();if(!n)return;delete n.deleted;n.updated=today();filter='all';remember();nav();persist();render();toast('笔记已恢复')};$('hide').onclick=()=>native?send('hide'):toast('桌面版可收起到苔藓');$('export').onclick=()=>{let n=current();if(!n)return;if(native){send('export',{text:n.title+'\n\n'+n.body});return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([n.title+'\n\n'+n.body],{type:'text/plain;charset=utf-8'}));a.download=(n.title||'Sneakkkkk笔记')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey){if(e.key==='k'){e.preventDefault();$('search').focus()}if(e.key==='n'){e.preventDefault();add()}}});if(native)send('load');else boot(JSON.parse(localStorage.getItem('mellow-notes')||'null'));
</script></html>
