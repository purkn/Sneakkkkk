<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#fafafa;font:12px monospace}header{display:flex;gap:5px;margin-bottom:8px;-webkit-app-region:drag}button,select{font:11px monospace;border:1px solid #ccc;background:white;padding:4px;-webkit-app-region:no-drag}select{width:145px}textarea{width:100%;height:185px;resize:none;border:0;background:transparent;outline:0;font:13px/1.6 monospace}#history{height:100px;border-bottom:1px solid #ddd}#err{color:#a33}#restore{position:absolute;right:8px;top:5px;opacity:.4}</style><header id="tools"><select id="docs"></select><button id="previous">前文</button><button id="open">打开</button><button id="minimal">−</button></header><button id="restore" hidden>⋯</button><textarea id="history" hidden></textarea><textarea id="text"></textarea><div id="err"></div><script>
const $=id=>document.getElementById(id);let mode='quick',id=null,state,key,queue=Promise.resolve();function stash(){const k=key,v=$('text').value;queue=queue.then(()=>desktop.invoke('draft',{key:k,text:v})).catch(e=>$('err').textContent=e.message)}async function openMode(m,n){if(key){stash();await queue}mode=m;state=await desktop.invoke('state');id=n||id||state.notes[0]?.id;key=mode==='quick'?'quick':'append-'+id;$('tools').hidden=mode==='quick';$('restore').hidden=true;$('history').hidden=true;$('text').value=state.drafts[key]||'';$('docs').innerHTML='';for(const doc of state.notes){const o=document.createElement('option');o.value=doc.id;o.textContent=doc.title||'未命名文档';$('docs').append(o)}$('docs').value=id||'';$('err').textContent='';$('text').focus()}window.openMode=openMode;$('text').oninput=stash;$('docs').onchange=()=>openMode('document',$('docs').value);$('open').onclick=()=>desktop.invoke('main',{id});$('previous').onclick=()=>{const doc=state.notes.find(n=>n.id===id);if($('history').hidden)$('history').value=state.drafts['history-'+id]??doc?.body??'';$('history').hidden=!$('history').hidden};$('history').oninput=()=>{const k='history-'+id,v=$('history').value;queue=queue.then(()=>desktop.invoke('draft',{key:k,text:v})).catch(e=>$('err').textContent=e.message)};$('minimal').onclick=()=>{$('tools').hidden=true;$('history').hidden=true;$('restore').hidden=false};$('restore').onclick=()=>{$('tools').hidden=false;$('restore').hidden=true};document.onkeydown=async e=>{if(e.key==='Escape'){await queue;desktop.invoke('hide')}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();try{await queue;await desktop.invoke('submit',{mode,id,key,text:$('text').value,history:mode==='document'&&!$('history').hidden?$('history').value:null});$('text').value=''}catch(e){$('err').textContent=e.message}}};window.onblur=stash;
</script>
