<!doctype html><meta charset="utf-8"><style>body{font:14px sans-serif;padding:20px;color:#222}label{display:flex;justify-content:space-between;margin:18px 0}input{width:245px;padding:6px}button{padding:8px;background:white;border:1px solid #aaa}small{color:#777}#result{color:#777}</style><h3>快捷键与图标</h3><label>速记<input id="quick"></label><label>文档<input id="document"></label><label>隐藏<input id="hide"></label><small>格式示例：Control+Alt+Space、CommandOrControl+Shift+D</small><p><button id="save">保存快捷键</button> <button id="icon">选择本地图标…</button></p><p id="result"></p><script>const $=id=>document.getElementById(id);desktop.invoke('state').then(s=>{for(const k of ['quick','document','hide'])$(k).value=s.config[k]});$('save').onclick=async()=>{try{await desktop.invoke('settings',Object.fromEntries(['quick','document','hide'].map(k=>[k,$(k).value])));$('result').textContent='已保存'}catch(e){$('result').textContent=e.message}};$('icon').onclick=()=>desktop.invoke('icon').catch(e=>$('result').textContent=e.message)</script>
